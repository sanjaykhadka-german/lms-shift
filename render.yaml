services:
  # ─── DORMANT (Phase 5 — Flask retired 2026-05-08) ───
  # Block kept in place so the service can be restarted from the Render
  # dashboard for emergency rollback. Source has been moved to
  # legacy-flask/ — build/start commands point there. autoDeploy is off so
  # nothing redeploys this service automatically.
  #
  # Once lms-web has been verified in prod for the soak period (see
  # legacy-flask/README.md), this whole block can be removed.
  - type: web
    name: lms
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r legacy-flask/requirements.txt
    startCommand: cd legacy-flask && gunicorn app:app --timeout 180 --workers 2
    envVars:
      - key: TZ
        value: Australia/Sydney
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: Tracey
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: sanjay.khadka@germanbutchery.com.au
      - key: PASS_THRESHOLD
        value: "80"
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      # ─── Phase 2 SSO bridge ───
      # LMS_SSO_SECRET is generated on the lms-web service (below) and must
      # be copied here manually — Render doesn't have a "syncFromService"
      # mechanism, so this is a dashboard step.
      - key: LMS_SSO_SECRET
        sync: false
      # The single Tracey tenant (workspace) UUID allowed to SSO into Flask.
      # Phase 3+ may relax this when Flask becomes multi-tenant.
      - key: LMS_ALLOWED_TENANT_ID
        sync: false

  # ─── Tracey monorepo (added Phase 1) ───
  - type: web
    name: lms-web
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tracey/db run migrate && pnpm --filter lms-web build
    startCommand: pnpm --filter lms-web start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TZ
        value: Australia/Sydney
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: NODE_VERSION
        value: "22.13.0"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: Tracey
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: FLASK_BASE_URL
        sync: false
      - key: LMS_SSO_SECRET
        generateValue: true
      # Comma-separated emails. Members of this list see the /platform
      # super-admin surface. Keep tightly scoped to actual operators.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Phase 7a — auto-provision a per-tenant schema for every new signup
      # via onboarding/actions.ts. Off would silently leave new tenants on
      # the legacy public.lms_* fallback (the DIGITECH bug, 2026-05-11).
      - key: PER_TENANT_SCHEMA_ENABLED
        value: "true"

  # ─── ShiftCraft (added 2026-06-17) ───
  # Codified from the previously dashboard-only service so deploys are
  # reproducible. Deploys from the long-lived `shiftcraft/...` branch (NOT
  # main — see the branch-isolation rule). autoDeploy stays off: ShiftCraft
  # ships per-slice and is deployed manually.
  #
  # buildCommand WARMS pnpm via `corepack prepare ... --activate` so the
  # startCommand uses the cached binary instead of re-downloading pnpm at
  # boot — that runtime download is what crash-looped the 2026-06-17 deploy
  # (`UND_ERR_SOCKET: other side closed`). COREPACK_INTEGRITY_KEYS=0 below
  # additionally skips the signature check that broke the very first deploy.
  #
  # ⚠️ BEFORE pointing Render at this Blueprint: reconcile the envVars below
  # against the live dashboard. Secrets are `sync: false` ON PURPOSE so the
  # Blueprint NEVER regenerates them — regenerating AUTH_SECRET logs every
  # user out, and regenerating TRACEY_PII_ENC_KEY makes all stored payroll
  # PII undecryptable. Copy the existing dashboard values in; don't let them
  # generate. Verify the list is complete (per-seat Stripe price IDs etc.).
  - type: web
    name: shiftcraft-web
    runtime: node
    plan: free
    branch: shiftcraft/session-2026-05-13
    autoDeploy: false
    buildCommand: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter shiftcraft-web build
    startCommand: pnpm --filter shiftcraft-web start
    envVars:
      - key: TZ
        value: Australia/Sydney
      - key: NODE_VERSION
        value: "22.13.0"
      # Belt-and-braces against the Node 22.13.0 corepack signature failure.
      - key: COREPACK_INTEGRITY_KEYS
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      # ── Auth.js — DO NOT regenerate. Copy existing dashboard values. ──
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      # ── Per-tenant PII encryption — DO NOT regenerate (would orphan all
      #    encrypted TFN/BSB/account/super data). Copy existing value. ──
      - key: TRACEY_PII_ENC_KEY
        sync: false
      # ── Mail (Resend) ──
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: ShiftCraft
      # ── App URLs. NEXT_PUBLIC_* are inlined at BUILD time; SHIFTCRAFT_URL
      #    is read at RUNTIME for email links. Kept sync:false so the
      #    Blueprint doesn't clobber the dashboard's prod URLs. ──
      - key: SHIFTCRAFT_URL
        sync: false
      - key: NEXT_PUBLIC_SHIFTCRAFT_URL
        sync: false
      - key: NEXT_PUBLIC_LMS_URL
        sync: false
      - key: NEXT_PUBLIC_HUB_URL
        sync: false
      # ── Platform super-admin allowlist (comma-separated emails) ──
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # ── Per-tenant schema provisioning on signup (same as lms-web) ──
      - key: PER_TENANT_SCHEMA_ENABLED
        value: "true"
      # ── Stripe (per-seat). Add any STRIPE_PRICE_* the dashboard has. ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── Per-app billing gate. ENFORCED ("true") since 2026-06-25: tenants
      #    without an active shiftcraft tenant_subscriptions row hit the
      #    billing wall. Roll back by setting this to "false" + redeploy. ──
      - key: SHIFTCRAFT_BILLING_ENFORCED
        value: "true"
      # ── Xero payroll export ──
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_REDIRECT_URI
        sync: false
      - key: XERO_SCOPES
        sync: false
      # ── Web push (kiosk/shift notifications) ──
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # ── Kiosk cookie signing. DO NOT regenerate — rotating either secret
      #    invalidates every paired kiosk's device cookie, un-pairing all of
      #    them. Copy the existing dashboard values; must be ≥32 chars. ──
      - key: KIOSK_DEVICE_SECRET
        sync: false
      - key: KIOSK_ACTOR_SECRET
        sync: false

  - type: cron
    name: lms-stripe-reconcile
    runtime: node
    plan: free
    schedule: "0 3 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter lms-web run reconcile:stripe
    envVars:
      - key: TZ
        value: Australia/Sydney
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: NODE_VERSION
        value: "22.13.0"
      - key: STRIPE_SECRET_KEY
        sync: false

  # Phase 5 — replaces Flask's lazy WHS reminder pass that used to run on
  # each admin GET. Once Flask is dormant, no admin GET fires that code, so
  # WHS expiry reminders need a real cron. Iterates every tenant.
  - type: cron
    name: lms-whs-reminders
    runtime: node
    plan: free
    schedule: "0 20 * * *"  # 20:00 UTC = 06:00 Australia/Sydney (AEST/AEDT auto-handled by TZ)
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter lms-web run cron:whs-reminders
    envVars:
      - key: TZ
        value: Australia/Sydney
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: NODE_VERSION
        value: "22.13.0"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: Tracey

databases:
  - name: lms-db
    plan: free
